{% if widget.is_initial %}
<div class="d-flex align-items-center gap-2 p-2 rounded border bg-light small mb-2">
    <span class="text-muted">&#128196;</span>
    <span class="text-truncate flex-grow-1">{{ widget.display_name }}</span>
    <label class="mb-0 d-flex align-items-center gap-1 text-danger flex-shrink-0">
        <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="form-check-input m-0">
        {{ widget.clear_checkbox_label }}
    </label>
</div>
{% endif %}
<input type="{{ widget.input_type }}" name="{{ widget.name }}" class="form-control form-control-sm"{% include "django/forms/widgets/attrs.html" %}>
